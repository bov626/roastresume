<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Your Report — OE Risk Report</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;
    min-height:100vh;overflow-x:hidden;
  }

  .container{
    max-width:640px;margin:0 auto;
    padding:60px 24px 80px;
  }

  .eyebrow{
    font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    color:#333;margin-bottom:16px;
  }
  .headline{
    font-size:clamp(28px,5vw,44px);
    font-weight:900;letter-spacing:-.03em;line-height:1.1;
    margin-bottom:8px;
  }
  .headline span{color:#d91e1e}
  .subline{font-size:15px;color:#444;margin-bottom:48px}

  .section-rule{
    width:40px;height:3px;background:#d91e1e;
    border-radius:2px;margin:0 0 20px 0;
  }
  .while-heading{
    font-size:20px;font-weight:800;letter-spacing:-.02em;
    margin-bottom:6px;
  }
  .while-sub{font-size:14px;color:#444;margin-bottom:24px}

  /* Video cards */
  .video-cards{display:flex;flex-direction:column;gap:12px}
  .video-card{
    display:flex;align-items:center;gap:16px;
    background:#0e0e0e;border:1px solid #1a1a1a;
    border-radius:12px;padding:16px;
    color:#fff;
    transition:border-color .15s, background .15s;
    cursor:pointer;
    width:100%;text-align:left;
    font-family:'Inter',sans-serif;
    border:1px solid #1a1a1a;
  }
  .video-card:hover{border-color:#2a2a2a;background:#111}
  .video-card.locked{
    cursor:default;opacity:.5;
    background:#0e0e0e;
  }
  .video-card.locked:hover{border-color:#1a1a1a;background:#0e0e0e}

  .vid-thumb{
    width:72px;height:48px;
    background:#111;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;position:relative;
  }
  .vid-play{color:#d91e1e;font-size:20px}
  .vid-exclusive{
    position:absolute;top:-6px;right:-6px;
    background:#d91e1e;color:#fff;
    font-size:7px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 5px;border-radius:3px;
  }
  .vid-lock{
    position:absolute;top:-6px;right:-6px;
    background:#1a1a1a;color:#444;
    font-size:8px;padding:3px 5px;border-radius:3px;
  }
  .vid-title{font-size:13px;font-weight:700;margin-bottom:3px}
  .vid-meta{font-size:11px;color:#333}
  .vid-locked-label{font-size:11px;color:#d91e1e;font-weight:600;margin-top:4px}

  /* Video Modal */
  #vid-overlay{
    position:fixed;inset:0;z-index:1000;
    background:rgba(0,0,0,0.88);
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  #vid-overlay.open{opacity:1;pointer-events:all}
  #vid-modal{
    width:100%;max-width:840px;
    background:#0e0e0e;
    border:1px solid #1e1e1e;
    border-radius:16px;
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .vm-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid #1a1a1a;
    flex-shrink:0;
  }
  .vm-title{font-size:13px;font-weight:700;color:#fff}
  .vm-close{
    background:none;border:none;color:#555;cursor:pointer;
    font-size:26px;line-height:1;padding:0 4px;
    transition:color .15s;
    font-family:'Inter',sans-serif;
  }
  .vm-close:hover{color:#fff}
  .vm-player{
    width:100%;aspect-ratio:16/9;background:#000;
  }
  .vm-player iframe{
    width:100%;height:100%;border:none;display:block;
  }
  .vm-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
    border-top:1px solid #1a1a1a;
    gap:12px;
  }
  .vm-nav-btn{
    display:flex;align-items:center;gap:6px;
    background:none;border:1px solid #1e1e1e;
    color:#555;font-size:12px;font-weight:600;
    padding:8px 18px;border-radius:8px;cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:border-color .15s,color .15s;
  }
  .vm-nav-btn:hover{border-color:#333;color:#fff}
  .vm-nav-btn:disabled{opacity:.25;pointer-events:none}
  .vm-counter{font-size:11px;color:#333;text-align:center}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow">OE Risk Report</div>
  <h1 class="headline"><span id="name-out">Hey</span>, give us 20ish mins.</h1>
  <p class="subline" id="headline-sub">Your report is being built.</p>

  <div class="section-rule"></div>
  <div class="while-heading">While you wait.</div>
  <p class="while-sub">Here's 2 of 3 exclusive videos. The third is in your report.</p>

  <div class="video-cards">
    <button class="video-card" onclick="openVideo(0)">
      <div class="vid-thumb">
        <span class="vid-play">▶</span>
        <span class="vid-exclusive">Exclusive</span>
      </div>
      <div class="vid-info">
        <div class="vid-title">How to pass background checks</div>
        <div class="vid-meta">9 min · Exclusive</div>
      </div>
    </button>

    <button class="video-card" onclick="openVideo(1)">
      <div class="vid-thumb">
        <span class="vid-play">▶</span>
        <span class="vid-exclusive">Exclusive</span>
      </div>
      <div class="vid-info">
        <div class="vid-title">Managing two calendars without losing your mind</div>
        <div class="vid-meta">14 min · Exclusive</div>
      </div>
    </button>

    <div class="video-card locked">
      <div class="vid-thumb">
        <span style="font-size:18px">🔒</span>
        <span class="vid-lock">Locked</span>
      </div>
      <div class="vid-info">
        <div class="vid-title" style="color:#333">The OE exit strategy</div>
        <div class="vid-locked-label">Be patient. It's in the report.</div>
      </div>
    </div>
  </div>

</div>

<!-- Video Modal -->
<div id="vid-overlay" onclick="handleOverlayClick(event)">
  <div id="vid-modal">
    <div class="vm-header">
      <span class="vm-title" id="vm-title-text">Exclusive Video</span>
      <button class="vm-close" onclick="closeVideo()">×</button>
    </div>
    <div class="vm-player">
      <iframe
        id="vm-iframe"
        src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
    <div class="vm-nav">
      <button class="vm-nav-btn" id="vm-prev" onclick="prevVideo()">← Previous</button>
      <span class="vm-counter" id="vm-counter"></span>
      <button class="vm-nav-btn" id="vm-next" onclick="nextVideo()">Next →</button>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || 'Hey';
  document.getElementById('name-out').textContent = name;

  const VIDEOS = [
    { title: 'How to pass background checks', youtubeId: 'zLmFs0AkIAI' },
    { title: 'Managing two calendars without losing your mind', youtubeId: 'FbaWuuP7uak' },
  ];

  let currentVideo = 0;

  function openVideo(idx) {
    currentVideo = idx;
    renderModal();
    document.getElementById('vid-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeVideo() {
    document.getElementById('vid-overlay').classList.remove('open');
    document.getElementById('vm-iframe').src = '';
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('vid-overlay')) closeVideo();
  }

  function prevVideo() {
    if (currentVideo > 0) { currentVideo--; renderModal(); }
  }

  function nextVideo() {
    if (currentVideo < VIDEOS.length - 1) { currentVideo++; renderModal(); }
  }

  function renderModal() {
    const v = VIDEOS[currentVideo];
    document.getElementById('vm-title-text').textContent = v.title;
    document.getElementById('vm-iframe').src =
      'https://www.youtube.com/embed/' + v.youtubeId + '?rel=0';
    document.getElementById('vm-counter').textContent =
      (currentVideo + 1) + ' of ' + VIDEOS.length;
    document.getElementById('vm-prev').disabled = currentVideo === 0;
    document.getElementById('vm-next').disabled = currentVideo === VIDEOS.length - 1;
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeVideo();
  });
</script>

</body>
</html>
