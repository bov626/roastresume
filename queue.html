<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're in the queue — Please Roast My Resume</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://assets.calendly.com/assets/external/widget.css"
      rel="stylesheet"
    />
    <script
      src="https://assets.calendly.com/assets/external/widget.js"
      async
    ></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --red: #d91e1e;
      }
      body {
        font-family: "Inter", sans-serif;
        background: #000;
        background-image: radial-gradient(
            ellipse 80% 50% at 10% 0%,
            rgba(180, 20, 20, 0.13) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 60% 40% at 90% 100%,
            rgba(80, 10, 10, 0.1) 0%,
            transparent 70%
          );
        color: #fff;
        min-height: 100vh;
        overflow-x: hidden;
      }

      #fo-fireworks {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        width: 100%;
        height: 100%;
      }

      .queue-root {
        position: relative;
        z-index: 1;
        max-width: 820px;
        margin: 0 auto;
        padding: 64px 24px 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      /* Red ambient glow behind check */
      .queue-root::before {
        content: "";
        position: absolute;
        top: 120px;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 340px;
        height: 340px;
        background: radial-gradient(
          circle,
          rgba(217, 30, 30, 0.14) 0%,
          transparent 70%
        );
        pointer-events: none;
        opacity: 0;
        transition: opacity 1s ease 0.2s;
      }
      .queue-root.q-live::before {
        opacity: 1;
      }

      /* SVG check */
      .fo-chk-wrap {
        margin-bottom: 22px;
        opacity: 0;
        transform: scale(0.4);
      }
      .q-live .fo-chk-wrap {
        animation: chkPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .fo-chk-svg {
        width: 72px;
        height: 72px;
      }
      .fo-chk-circle {
        fill: none;
        stroke: var(--red);
        stroke-width: 2;
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
      }
      .q-live .fo-chk-circle {
        animation: drawCircle 0.55s ease 0.1s both;
      }
      .fo-chk-mark {
        fill: none;
        stroke: var(--red);
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
      }
      .q-live .fo-chk-mark {
        animation: drawCheck 0.38s ease 0.55s both;
      }

      @keyframes chkPop {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes drawCircle {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes drawCheck {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Headline */
      .fo-q-headline {
        font-size: clamp(30px, 4.5vw, 40px);
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #fff;
        margin-bottom: 18px;
        opacity: 0;
        transform: translateY(16px);
      }
      .q-live .fo-q-headline {
        animation: qFadeUp 0.52s ease 0.55s both;
      }

      /* Count row */
      .fo-q-count {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.45);
        opacity: 0;
        transform: translateY(16px);
      }
      .q-live .fo-q-count {
        animation: qFadeUp 0.52s ease 0.78s both;
      }
      #fo-queue-num {
        font-size: 18px;
        font-weight: 900;
        color: #fff;
        text-decoration: underline;
        text-decoration-color: var(--red);
        text-underline-offset: 4px;
        text-decoration-thickness: 2px;
      }

      /* Sub copy */
      .fo-q-sub {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.28);
        margin-bottom: 38px;
        margin-top: 4px;
        opacity: 0;
        transform: translateY(16px);
      }
      .q-live .fo-q-sub {
        animation: qFadeUp 0.52s ease 1s both;
      }

      .fo-q-skip-line {
        font-size: 18px;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.01em;
        margin-bottom: 16px;
        text-align: center;
        opacity: 0;
        transform: translateY(16px);
      }
      .q-live .fo-q-skip-line {
        animation: qFadeUp 0.52s ease 1.2s both;
      }

      .fo-calendly-wrap {
        width: 100%;
        opacity: 0;
        transform: translateY(16px);
      }
      .q-live .fo-calendly-wrap {
        animation: qFadeUp 0.6s ease 1.35s both;
      }
      .calendly-inline-widget {
        min-width: 100%;
        height: 700px;
        border-radius: 10px;
        overflow: hidden;
      }

      @keyframes qFadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="fo-fireworks"></canvas>

    <div class="queue-root" id="queue-root">
      <!-- Animated checkmark -->
      <div class="fo-chk-wrap">
        <svg class="fo-chk-svg" viewBox="0 0 52 52">
          <circle class="fo-chk-circle" cx="26" cy="26" r="23" />
          <path class="fo-chk-mark" d="M14 27 L22 35 L38 18" />
        </svg>
      </div>

      <div class="fo-q-headline">You're in the queue.</div>

      <div class="fo-q-count">
        <span>There are</span>
        <span id="fo-queue-num">0</span>
        <span>people in front of you.</span>
      </div>

      <div class="fo-q-sub">For now, check your email for the template.</div>

      <div class="fo-q-skip-line">Want to skip the line?</div>

      <div class="fo-calendly-wrap">
        <div
          class="calendly-inline-widget"
          data-url="https://calendly.com/wyedoyoudothis/resume_roast"
        ></div>
      </div>
    </div>

    <script>
      let QUEUE_COUNT = 0;

      function countUp(el, to, duration) {
        el.textContent = "0";
        const start = performance.now();
        function tick(now) {
          const elapsed = now - start;
          const p = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.floor(to * ease).toLocaleString();
          if (p < 1) requestAnimationFrame(tick);
          else el.textContent = to.toLocaleString();
        }
        requestAnimationFrame(tick);
      }

      function launchFireworks() {
        const canvas = document.getElementById("fo-fireworks");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext("2d");
        const particles = [];
        const palette = [
          "#d91e1e",
          "#ff3c3c",
          "#ff7a00",
          "#ffffff",
          "#ffcc00",
          "#ff5588",
        ];

        function burst(x, y, count) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2.5 + Math.random() * 5.5;
            particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - (1.5 + Math.random() * 2),
              alpha: 1,
              color: palette[Math.floor(Math.random() * palette.length)],
              size: 1.5 + Math.random() * 3,
              decay: 0.012 + Math.random() * 0.014,
              gravity: 0.12,
              trail: [],
            });
          }
        }

        const cx = canvas.width / 2;
        const cy = canvas.height * 0.28;

        burst(cx, cy, 70);
        setTimeout(() => burst(cx - 110, cy + 20, 50), 220);
        setTimeout(() => burst(cx + 110, cy + 20, 50), 380);
        setTimeout(() => burst(cx, cy - 60, 40), 540);

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          for (const p of particles) {
            if (p.alpha <= 0) continue;
            alive = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= 0.97;
            p.alpha -= p.decay;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          if (alive) requestAnimationFrame(draw);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        draw();
      }

      (function init() {
        const root = document.getElementById("queue-root");
        const numEl = document.getElementById("fo-queue-num");

        fetch("/api/queue-count")
          .then((r) => r.json())
          .then((d) => {
            QUEUE_COUNT = d.count;
          })
          .catch(() => {})
          .finally(() => {
            root.classList.add("q-live");
            countUp(numEl, QUEUE_COUNT, 1800);
            setTimeout(launchFireworks, 700);
          });
      })();
    </script>
  </body>
</html>
